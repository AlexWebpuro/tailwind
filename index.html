<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-blue-500 text-white dark:bg-blue-900 dark:text-gray-200">
        <nav class="container mx-auto flex items-center justify-between py-4">
            <a href="" class="text-lg font-bold">Logo</a>
            <ul class="flex space-x-4">
                <li class="hover:text-gray-500">Home</li>
                <li class="hover:text-gray-500">About us</li>
                <li class="hover:text-gray-500">Team</li>
            </ul>
        </nav>
    </header>
    <!-- Hero Section -->
    <section class="relative bg-gradient-to-tr from-indigo-900 to-slate-900 text-white py-20 px-6 sm:px-12 md:py-32">
        <div class="max-w-6xl mx-auto flex flex-col-reverse md:flex-row items-center gap-12">
            
            <!-- Text Content -->
            <div class="flex-1 text-center md:text-left">
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold leading-tight tracking-tight mb-6">
                    Build beautiful modern sites with <span class="text-indigo-400">Tailwind CSS 3</span>
                </h1>
                <p class="text-lg sm:text-xl text-slate-300 mb-8 max-w-2xl mx-auto md:mx-0">
                    A beautiful, responsive hero section to capture your users' attention and communicate your value proposition immediately.
                </p>
                <div class="flex flex-col sm:flex-row justify-center md:justify-start gap-4">
                    <a href="#" class="px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-lg transition duration-300">
                        Get Started
                    </a>
                    <a href="#" class="px-8 py-4 bg-transparent hover:bg-white/10 text-white border-2 border-white/50 font-semibold rounded-lg transition duration-300">
                        Learn More
                    </a>
                </div>
            </div>

            <!-- Image/Visual Placeholder -->
            <div class="flex-1 w-full max-w-md md:max-w-none">
                <div class="aspect-video bg-indigo-500/20 rounded-2xl border border-white/10 shadow-2xl flex items-center justify-center p-8 backdrop-blur-sm">
                    <span class="text-indigo-300 font-semibold text-lg">Your Hero Image / Illustration Here</span>
                </div>
            </div>
            
        </div>
    </section>
</body>
</html>
